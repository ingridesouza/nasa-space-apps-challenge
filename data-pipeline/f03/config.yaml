# H2G2 · F03 (panorama/photos at the point) and F04 (science card)
# Paths relative to this file (data-pipeline/f03/).

# ETL output: tables in the project's single SQLite + files served at /bundle.
paths:
  db: ../../data/local/h2g2.sqlite
  bundle: ../../data/local/f03
  cache: ../../data/local/f03-cache
# Switching source = change "source" and run `python etl/build.py` again.
source: public            # mock | public | official

# F04 · science card. Switching source = change it here and run `python etl/build.py`.
science_source: public    # mock | public | official
card_radius_m: 150        # target farther than this: "no studied target"
science:
  targets_csv: data/m8_targets.csv
  index_csv: data/science_index.csv
  pds_dir: data/pds            # downloaded APXS/ChemCam/CheMin files (offline)
  mastcam_dir: data/mastcam    # Mastcam photos of the targets (copied to data/local/f03/mastcam/)
  terrain_geojson: data/terrain.geojson   # M6 (QGIS); without the file, the row does not appear

# CRISM (task 5): MTRDR product found in the Orbital Data Explorer on 13/11.
# Covers the whole window; ~18 m/px. `python etl/crism.py` generates the crop.
crism:
  product: FRT000058A3
  su_url: https://pds-geosciences.wustl.edu/mro/mro-m-crism-5-rdr-mptargeted-v1/mrocr_4001/mtrdr/2007/2007_112/frt000058a3/frt000058a3_07_su165j_mtr3.img
  page_url: https://pds-geosciences.wustl.edu/mro/mro-m-crism-5-rdr-mptargeted-v1/mrocr_4001/mtrdr/2007/2007_112/frt000058a3/
  crop_json: data/crism_boxwork.json

sols:
  min: 4550
  max: 4845

# Map window (task 2): rectangle of the stops + a ~300 m margin.
# Filled in by the build from the waypoints; these values come from M7.
window:
  lon_min: 137.374117
  lon_max: 137.388573
  lat_min: -4.815600
  lat_max: -4.794270
  margin_deg: 0.005

radius_m:
  panorama: 500           # decided on 12/11 (98% of the window covered)
  photos: 200

photos:
  per_stop: 3             # photos per stop, with different azimuths
  limit: 20               # maximum returned by the API
  el_min: -30             # accepted elevation (degrees): avoids photos of the ground
  el_max: 15
  min_az_sep: 40          # minimum separation between azimuths at the same stop

pano_max_width: 8000

# Mastcam color panoramas (one per stop), stored separately from the Navcam ones.
# Position = that of the stop (site/drive); center_az calibrated by hand against the Navcam
# of sol 4711 (same stop): mesa on the right and ridge on the left give ~140°, the
# antenna/RTG gives ~128° -> 135° ± 10°. vaov comes from the image aspect ratio; horizon_frac
# is the horizon height read on the image (fraction, 0 = top).
color_panos:
  - id: color_PIA26696B
    sol: 4718                  # reference sol of the drill hole (Nevado Sajama)
    site: 120
    drive: 82                  # stop 120_82 (sol 4711), the closest to 4718
    image: panorama_data/panos/colored_image.jpg
    max_width: 8192
    center_az: 135.0
    horizon_frac: 0.27
    page_url: https://science.nasa.gov/resource/curiosity-rover-360-degree-panorama-nevado-sajama/
    credit: NASA/JPL-Caltech/MSSS
    camera: Mastcam
    pos_quality: estimated
orbital_crop_m: 100
mars_radius_m: 3396190

# Inputs of the "public" source (paths relative to this file)
public:
  waypoints_url: https://mars.nasa.gov/mmgis-maps/MSL/Layers/json/MSL_waypoints.json
  waypoints_file: data/MSL_waypoints.json
  places_file: data/localized_interp.csv
  panoramas_csv: panorama_data/panoramas.csv
  panoramas_root: .
  hirise_tif: data/boxwork.tif
  raw_images_api: https://mars.nasa.gov/api/v1/raw_image_items/
  hirise_cog: https://asc-pds-services.s3.us-west-2.amazonaws.com/mosaic/Mars/MSL/MSL_Gale_HiRISE-LRGB_78quads_sharp_cog.tif
  request_delay_s: 0.5
