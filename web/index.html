<!doctype html>
<!-- H2G2 front in plain HTML/CSS/JS, served by the API (api/main.py).
     Vendored libs: MapLibre GL 6.17.0 (lib/maplibre/, BSD-3) and Pannellum 2.5.6 (lib/pannellum/, MIT). Nothing loads from outside. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Phones/tablets: always lay out as a 1280px-wide landscape screen. In portrait the CSS
    // rotates the whole UI (like a video player), so turning the device shows it upright.
    (function () {
      if (!matchMedia('(pointer: coarse) and (hover: none)').matches) return;
      var meta = document.querySelector('meta[name=viewport]');
      function fit() {
        var s = Math.min(screen.width, screen.height), l = Math.max(screen.width, screen.height);
        var portrait = matchMedia('(orientation: portrait)').matches;
        meta.content = 'width=' + (portrait ? Math.round(1280 * s / l) : 1280) + ', user-scalable=no';
      }
      fit();
      matchMedia('(orientation: portrait)').addEventListener('change', fit);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>H2G2 · Viewer</title>
  <link rel="stylesheet" href="lib/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="lib/pannellum/pannellum.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="rotate-hint" role="status" aria-live="polite">
    <svg class="rh-phone" viewBox="0 0 80 80" fill="none" aria-hidden="true">
      <path class="rh-arc" d="M14 40a26 26 0 0 1 26-26" stroke="#E8643F" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round"/>
      <g class="rh-body"><rect x="28" y="12" width="24" height="56" rx="5" stroke="#ececf0" stroke-width="2"/><line x1="36" y1="62" x2="44" y2="62" stroke="#E8643F" stroke-width="2" stroke-linecap="round"/></g>
    </svg>
    <p class="rh-title">Turn your device sideways</p>
    <p class="rh-sub">Landscape view · like the visor</p>
    <span class="rh-skip">Tap to continue</span>
  </div>
  <script>
  (function () {
    var el = document.getElementById('rotate-hint');
    var portrait = matchMedia('(orientation: portrait) and (pointer: coarse) and (hover: none)');
    function hide() { el.classList.add('is-done'); setTimeout(function () { el.remove(); }, 600); }
    if (!portrait.matches) { el.remove(); return; }
    el.classList.add('is-on');
    el.addEventListener('click', hide);
    portrait.addEventListener('change', function (e) { if (!e.matches) hide(); });
    setTimeout(hide, 4000);
  })();
  </script>
  <div class="app">
    <!-- VIEWER: the astronaut's view (panorama or photo) -->
    <main id="viewer" class="viewer grid-bg">
      <div id="viewer-stage" class="viewer-stage">
        <img id="viewer-img" class="viewer-img" alt="" hidden>
      </div>
      <button id="viewer-close" class="ibtn viewer-close" type="button" title="Back (Esc)" hidden>✕</button>
    </main>

    <div class="viewer-hud mono">
      <span class="eyebrow">H2G2</span>
    </div>

    <!-- F08: voice only. The pill shows the microphone state; click turns "Hey Marvin" on/off -->
    <button id="btn-voice" class="pill frame mono" type="button" aria-pressed="true" title="Microphone always listening for &quot;Hey Marvin&quot;; click to turn it off. Or hold space to talk.">
      <span class="voice-icon" aria-hidden="true"></span><span id="voice-status" aria-live="polite">turning on the microphone…</span>
    </button>
    <section id="assistant" class="card panel assistant" hidden aria-label="H2G2 assistant"></section>

    <!-- MAP (F01): the same element becomes a circle (minimized) or full screen -->
    <div id="map-box" class="map-box" title="Expand map">
      <div id="map"></div>
      <p id="map-status" class="map-status mono">loading map…</p>
    </div>
    <div id="map-actions" class="map-actions">
      <button id="btn-route" class="btn btn-red btn-sm" type="button">Plan route</button>
    </div>
    <div id="layers-panel" class="card panel layers-panel" hidden></div>
    <div id="instruction" class="instruction mono" hidden></div>
    <div id="readout" class="readout mono" hidden></div>

    <form id="coords" class="coords panel frame" autocomplete="off" novalidate hidden>
      <div class="eyebrow">Destination</div>
      <label class="field"><span class="mono">LAT °</span>
        <input id="lat" class="mono" type="number" step="any" placeholder="-4.808008" required>
      </label>
      <label class="field"><span class="mono">LON °E</span>
        <input id="lon" class="mono" type="number" step="any" placeholder="137.381004" required>
      </label>
      <button class="btn btn-red btn-sm" type="submit">Send</button>
      <p id="coords-msg" class="coords-msg mono" hidden></p>
    </form>

    <!-- RIGHT BARS: route and images, independent (each with its own open/close button) -->
    <div id="floating" class="floating">
      <div id="g-route" class="group">
        <button class="ibtn ibtn-sm group-toggle" type="button" data-name="route" title="Collapse route" aria-expanded="true">›</button>
        <section id="c-route" class="card panel route-card" hidden></section>
      </div>

      <div id="g-images" class="group">
        <button class="ibtn ibtn-sm group-toggle" type="button" data-name="images" title="Collapse images" aria-expanded="true">›</button>
        <section id="c-status" class="card panel" hidden></section>

        <section id="c-pano" class="card panel" hidden>
          <div class="pano-slot"><div id="pano"></div>
          </div>
          <p id="pano-caption" class="caption mono"></p>
        </section>

        <section id="c-photos" class="card panel" hidden>
          <div id="photos" class="photos"></div>
          <div id="photos-nav" class="photos-nav" hidden>
            <button type="button" id="photos-prev" class="photos-arrow" aria-label="Previous page">‹</button>
            <span id="photos-page" class="photos-page"></span>
            <button type="button" id="photos-next" class="photos-arrow" aria-label="Next page">›</button>
          </div>
        </section>
      </div>
    </div>
    <!-- ANSWER CARD (F08, replaced the F04 science card): structured answer to the astronaut's
         question; with no question, the science card of the route destination. Left of the bar. -->
    <div id="answer-cards" class="answer-cards">
      <details id="c-answer" class="card panel answer-card" hidden>
        <summary><span class="answer-name"></span><span class="answer-tag tag"></span></summary>
        <div id="answer" class="answer-body"></div>
      </details>
    </div>
  </div>

  <script src="lib/pannellum/pannellum.js"></script>
  <script src="science-card.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
