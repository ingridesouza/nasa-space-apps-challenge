<!doctype html>
<!-- Front H2G2 em HTML/CSS/JS puro, servido pela API (api/main.py).
     Libs vendorizadas: MapLibre GL 6.17.0 (lib/maplibre/, BSD-3) e Pannellum 2.5.6 (lib/pannellum/, MIT). Nada carrega de fora. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>H2G2 · Visor</title>
  <link rel="stylesheet" href="lib/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="lib/pannellum/pannellum.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- VISOR: visão do astronauta (panorama ou foto) -->
    <main id="visor" class="visor grid-bg">
      <div id="visor-stage" class="visor-stage">
        <p id="visor-vazio" class="visor-vazio mono">Abra o panorama (⤢) ou uma foto para ver aqui.</p>
        <img id="visor-img" class="visor-img" alt="" hidden>
      </div>
      <button id="visor-fechar" class="ibtn visor-fechar" type="button" title="Voltar (Esc)" hidden>✕</button>
    </main>

    <div class="visor-hud mono">
      <span class="eyebrow">H2G2 · visor</span>
      <span id="hud-pos" class="hud-pos">localizando…</span>
      <span id="hud-local" class="hud-pos"></span>
    </div>

    <!-- F08: assistente local -->
    <button id="btn-assistente" class="pilula mono" type="button" aria-expanded="false" aria-controls="assistente">◎ Perguntar ao H2G2 <kbd>/</kbd></button>
    <section id="assistente" class="card panel assistente" hidden aria-label="Assistente H2G2"></section>

    <!-- MAPA (F01): o mesmo elemento vira círculo (minimizado) ou tela cheia -->
    <div id="mapa-box" class="mapa-box" title="Expandir mapa">
      <div id="mapa"></div>
      <p id="mapa-status" class="mapa-status mono">carregando mapa…</p>
    </div>
    <div id="mapa-acoes" class="mapa-acoes">
      <button id="btn-expandir" class="ibtn" type="button" title="Expandir mapa">⤢</button>
      <button id="btn-rota" class="btn btn-red btn-sm" type="button">Planejar rota</button>
    </div>
    <div id="camadas" class="card panel camadas" hidden></div>
    <div id="instrucao" class="instrucao mono" hidden></div>
    <div id="leitura" class="leitura mono" hidden></div>

    <form id="coords" class="coords panel frame" autocomplete="off" novalidate hidden>
      <div class="eyebrow">Destino</div>
      <label class="campo"><span class="mono">LAT °</span>
        <input id="lat" class="mono" type="number" step="any" placeholder="-4.808008" required>
      </label>
      <label class="campo"><span class="mono">LON °E</span>
        <input id="lon" class="mono" type="number" step="any" placeholder="137.381004" required>
      </label>
      <button class="btn btn-red btn-sm" type="submit">Enviar</button>
      <p id="coords-msg" class="coords-msg mono" hidden></p>
    </form>

    <!-- CARDS FLUTUANTES: rota, status/segurança, panorama, fotos -->
    <div id="flutuante" class="flutuante" hidden>
      <section id="c-rota" class="card panel rota-card" hidden></section>
      <section id="c-status" class="card panel" hidden></section>

      <section id="c-pano" class="card panel" hidden>
        <div class="pano-slot"><div id="pano"></div>
          <button id="pano-expandir" class="ibtn ibtn-sm" type="button" title="Expandir no visor">⤢</button>
        </div>
        <p id="pano-rotulo" class="rotulo mono"></p>
      </section>

      <section id="c-fotos" class="card panel" hidden>
        <div id="fotos" class="fotos"></div>
        <div id="fotos-nav" class="fotos-nav" hidden>
          <button type="button" id="fotos-prev" class="fotos-seta" aria-label="Página anterior">‹</button>
          <span id="fotos-pag" class="fotos-pag"></span>
          <button type="button" id="fotos-next" class="fotos-seta" aria-label="Próxima página">›</button>
        </div>
      </section>
    </div>
    <!-- FICHAS (F04): coluna à esquerda da barra, empilha para cima -->
    <div id="fichas" class="fichas">
      <details id="c-ficha" class="card panel ficha-card" hidden>
        <summary><span id="ficha-nome" class="ficha-nome"></span><span id="ficha-tipo" class="tag tag-red"></span></summary>
        <div id="ficha" class="ficha-body"></div>
      </details>
    </div>
    <button id="flutuante-toggle" class="ibtn ibtn-sm flutuante-toggle" type="button" title="Recolher barra" aria-expanded="true" aria-controls="flutuante">›</button>
  </div>

  <script src="lib/pannellum/pannellum.js"></script>
  <script src="card.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
