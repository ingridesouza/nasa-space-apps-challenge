<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H2G2 · Visor</title>
  <link rel="stylesheet" href="/web/lib/pannellum.css">
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <div class="app">
    <!-- VISOR: visão do astronauta -->
    <main id="visor" class="visor grid-bg">
      <div class="visor-hud mono">
        <span class="eyebrow">H2G2 · visor</span>
        <span id="hud-pos" class="hud-pos">sem posição</span>
      </div>

      <div id="visor-stage" class="visor-stage">
        <p id="visor-vazio" class="visor-vazio mono">Informe uma coordenada para posicionar o visor.</p>
        <img id="visor-img" class="visor-img" alt="" hidden>
      </div>
      <button id="visor-fechar" class="ibtn visor-fechar" type="button" title="Voltar (Esc)" hidden>✕</button>

      <form id="coords" class="coords panel frame" autocomplete="off" novalidate>
        <div class="eyebrow">Coordenadas</div>
        <label class="campo"><span class="mono">LAT °</span>
          <input id="lat" class="mono" type="number" step="any" value="-4.808008" placeholder="-4.808008" required>
        </label>
        <label class="campo"><span class="mono">LON °E</span>
          <input id="lon" class="mono" type="number" step="any" value="137.381004" placeholder="137.381004" required>
        </label>
        <button class="btn btn-red btn-sm" type="submit">Enviar</button>
        <p id="coords-msg" class="coords-msg mono" hidden></p>
      </form>
    </main>

    <!-- CARDS FLUTUANTES: só aparecem após enviar uma coordenada -->
    <div id="flutuante" class="flutuante" hidden>
      <section id="c-status" class="card panel" hidden></section>

      <section id="c-pano" class="card panel" hidden>
        <div class="pano-slot"><div id="pano"></div>
          <button id="pano-expandir" class="ibtn ibtn-sm" type="button" title="Expandir no visor">⤢</button>
        </div>
        <p id="pano-rotulo" class="rotulo mono"></p>
      </section>

      <section id="c-fotos" class="card panel" hidden>
        <div id="fotos" class="fotos"></div>
      </section>

    </div>
    <!-- FICHAS: coluna à esquerda da barra, alinhada ao bloco de fotos; empilha para cima -->
    <div id="fichas" class="fichas">
      <details id="c-ficha" class="card panel ficha-card" hidden>
        <summary><span id="ficha-nome" class="ficha-nome"></span><span id="ficha-tipo" class="tag tag-red"></span></summary>
        <div id="ficha" class="ficha-body"></div>
      </details>
    </div>
    <button id="flutuante-toggle" class="ibtn ibtn-sm flutuante-toggle" type="button" title="Recolher barra" aria-expanded="true" aria-controls="flutuante">›</button>
  </div>

  <script src="/web/lib/pannellum.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
